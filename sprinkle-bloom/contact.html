<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:"
  />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Order | Sprinkle &amp; Bloom</title>
  <meta name="description" content="Order your custom dream cake from Sprinkle & Bloom." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="particle-field" id="particleField" aria-hidden="true"></div>

  <header class="header" id="header">
    <nav class="nav container">
      <a href="index.html" class="logo"><span class="logo-text">Sprinkle&nbsp;Bloom</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="cakes.html">Our Treats</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html" class="btn btn-primary btn-small active">Order</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="order" class="section">
      <div class="container order-box reveal">
        <div class="section-head">
          <span class="overline">Bespoke Orders</span>
          <h2 class="section-title">Order Your Cake</h2>
          <p class="section-sub">Tell us what you're craving and we'll whisk it into reality.</p>
        </div>

        <form class="order-form" id="orderForm" novalidate>
          <div class="field">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Sweet Tooth Sam" autocomplete="name" maxlength="80" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="sam@example.com" autocomplete="email" maxlength="254" required />
          </div>
          <div class="field">
            <label for="message">Describe Your Dream Cake</label>
            <textarea id="message" name="message" rows="4" maxlength="2000"
              placeholder="A 3-tier ube cream cake with fresh berries..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send My Cake Dream</button>
          <p class="form-note" id="formNote" role="status"></p>
        </form>

        <p class="contact-mini" style="margin-top:2rem;">
          Or email us at <a href="mailto:hello@sprinkleandbloom.com">hello@sprinkleandbloom.com</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-treats" aria-hidden="true">
        <img src="images/macarons.png" alt="" loading="lazy" />
        <img src="images/balloon-pink.png" alt="" loading="lazy" />
        <img src="images/cupcake.png" alt="" loading="lazy" />
        <img src="images/balloon-red.png" alt="" loading="lazy" />
        <img src="images/berry-tart.png" alt="" loading="lazy" />
      </div>
      <div class="footer-inner">
        <p class="footer-word">Sprinkle &amp; Bloom</p>
        <div class="footer-social">
          <a href="#" aria-label="Instagram">Instagram</a>
          <a href="#" aria-label="Pinterest">Pinterest</a>
          <a href="#" aria-label="Facebook">Facebook</a>
          <a href="#" aria-label="TikTok">TikTok</a>
        </div>
        <p class="footer-copy">© <span id="year"></span> Sprinkle &amp; Bloom Bakery. Baked with love.</p>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
