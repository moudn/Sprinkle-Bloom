<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
  />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Our Cakes | Sprinkle &amp; Bloom 🧁</title>
  <meta name="description" content="Browse whimsical custom cakes baked by Sprinkle & Bloom." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="particle-field" id="particleField" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true">🧁</div>

  <header class="header" id="header">
    <nav class="nav container">
      <a href="index.html" class="logo">
        <span class="logo-emoji">🧁</span>
        <span class="logo-text">Sprinkle&nbsp;&amp;&nbsp;Bloom</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="cakes.html" class="active">Our Cakes</a></li>
        <li><a href="how.html">How It Works</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="contact.html" class="btn btn-primary btn-small">Order Now</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- ===== Our Cakes Gallery ===== -->
    <section class="section cakes">
      <img src="images/balloon-red.png"  alt="" class="section-balloon float-decor" data-speed="-0.08" aria-hidden="true" loading="lazy" />
      <img src="images/balloon-pink.png" alt="" class="section-balloon section-balloon-left float-decor" data-speed="-0.12" aria-hidden="true" loading="lazy" />
      <div class="container">
        <h2 class="section-title reveal">Our Sweet Creations</h2>
        <p class="section-sub reveal">A peek at cakes we've baked with love. ✨</p>

        <div class="cake-grid cake-grid-4">
          <figure class="cake-card reveal">
            <div class="polaroid" data-tilt>
              <div class="cake-photo photo-1">
                <img src="images/strawberry-cake.png" alt="Hand-painted layered strawberry cream cake with strawberries and cherries" loading="lazy" width="400" height="400" />
              </div>
              <figcaption>🍰 Strawberry Bloom</figcaption>
            </div>
          </figure>
          <figure class="cake-card reveal">
            <div class="polaroid" data-tilt>
              <div class="cake-photo photo-2">
                <img src="images/berry-tart.png" alt="Hand-painted berry tart piled with strawberries, cherries and blueberries" loading="lazy" width="400" height="400" />
              </div>
              <figcaption>🍓 Berry Patch Tart</figcaption>
            </div>
          </figure>
          <figure class="cake-card reveal">
            <div class="polaroid" data-tilt>
              <div class="cake-photo photo-3">
                <img src="images/macarons.png" alt="Hand-painted stack of pastel pink, mint and lemon macarons" loading="lazy" width="400" height="400" />
              </div>
              <figcaption>🌸 Pastel Macaron Trio</figcaption>
            </div>
          </figure>
          <figure class="cake-card reveal">
            <div class="polaroid" data-tilt>
              <div class="cake-photo photo-4">
                <img src="images/cupcake.png" alt="Hand-painted cupcake with mint and vanilla swirl frosting topped with a cherry" loading="lazy" width="400" height="400" />
              </div>
              <figcaption>🍒 Cherry Cloud Cupcake</figcaption>
            </div>
          </figure>
        </div>

        <div class="center-btn reveal">
          <a href="contact.html" class="btn btn-primary">Order a Cake Like These 🧁</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-social">
        <a href="#" aria-label="Instagram">📸</a>
        <a href="#" aria-label="Pinterest">📌</a>
        <a href="#" aria-label="Facebook">👍</a>
        <a href="#" aria-label="TikTok">🎵</a>
      </div>
      <p class="footer-love">Baked with Love 💗 at Sprinkle &amp; Bloom</p>
      <p class="footer-copy">© <span id="year"></span> Sprinkle &amp; Bloom Bakery. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
